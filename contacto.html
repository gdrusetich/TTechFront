<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
    initial-scale=1.0">
    <title>Dinastía Gaming</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header class="header">
        <div class="header-saludo">
            <img src="logo.png" alt="Logo de tu sitio web" class="header-logo">
            <p>Hola, invitado!</p>
        </div>
        <div class="header-frase">
            <h1>Bienvenido a Talento Tech - Front End</h1>
        </div>
        <div class="header-login">
            <button class="btn-login">Ingresar</button>
        </div>
    </header>

    <main>
        <a href="index.html">    
            <section class="banner">
                <div class="banner-contenido">
                </div>
            </section>
        </a>
        <div class="flex-contacto">
            <section class="contacto-form">
                <h2 class ="sugerencias"> Sugerencias </h2>
                <form action="" method="post">
                    <div>
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje"
                        required></textarea>
                    </div>
                    <button type="submit"> Enviar</button>
                </form>
            </section>

            <section class="contacto-horarios">
                <h2 class="horario-atencion">Horarios de Atención</h2>
                <div>
                    <h4 class="horario-atencion-dias">Lunes a Viernes</h4>
                    <p class="horario-atencion-horas">9:00 hs - 14:00 hs</p>
                    <p class="horario-atencion-horas">16:00 hs - 21:00 hs</p>
                </div>
            </section>

        </div>
    </main>
</body>
</html>
